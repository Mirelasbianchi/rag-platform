[project]
name = "rag-platform"
version = "0.1.0"
description = "Production-style RAG API with FastAPI, PostgreSQL + pgvector, Docker and AWS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mirela Schneider Bianchi" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "numpy>=1.26",
    "litellm>=1.50",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
